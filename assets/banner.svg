<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg);opacity:.3}50%{transform:translateY(-15px) rotate(180deg);opacity:.7}}@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes waveFlow{0%{stroke-dashoffset:0}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.particle-1{animation:floatParticle 8s infinite ease-in-out}.particle-2{animation:floatParticle 12s infinite ease-in-out 2s}.particle-3{animation:floatParticle 10s infinite ease-in-out 4s}.glowing-orb{animation:pulseGlow 6s infinite ease-in-out;transform-origin:center}.animated-wave{stroke-dasharray:10 15;animation:waveFlow 20s linear infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="80" r="180" fill="#6366f1" class="glowing-orb" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="280" r="200" fill="#ec4899" class="glowing-orb" filter="url(#glow)" opacity=".12"/><path fill="none" stroke="url(#accentGrad)" stroke-width="2" d="M-50 280 Q 300 120 600 250 T 1250 180" class="animated-wave" opacity=".3"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M-50 310 Q 350 150 650 280 T 1250 210" class="animated-wave" opacity=".2"/><rect width="30" height="30" x="80" y="40" fill="#818cf8" class="particle-1" opacity=".3" rx="6"/><circle cx="1100" cy="90" r="16" fill="#f472b6" class="particle-2" opacity=".3"/><polygon fill="#c084fc" points="1020 300 1040 330 1000 330" class="particle-3" opacity=".3"/><rect width="1080" height="260" x="60" y="50" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" stroke-width="1" rx="12"/><g><g transform="translate(100, 100) translate(0, 0)"><rect width="280" height="32" fill="url(#accentGrad)" rx="16"/><text x="140" y="21" class="badge-text" text-anchor="middle">⚡ ENTERPRISE LEARNING &amp; LXP</text></g><text x="0" y="90" class="title" transform="translate(100, 100)">Awesome Enterprise Learning Platform</text><text x="0" y="130" class="subtitle" transform="translate(100, 100)">Curated SaaS Products, Open-Source LMS, LXPs &amp; Compliance Platforms</text><g transform="translate(100, 100) translate(0, 160)"><rect width="130" height="28" x="0" y="0" fill="#fff" fill-opacity=".1" rx="6"/><text x="65" y="19" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">☁️ 10+ SaaS</text><rect width="160" height="28" x="142" y="0" fill="#fff" fill-opacity=".1" rx="6"/><text x="222" y="19" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔓 11+ Open-Source</text><rect width="150" height="28" x="314" y="0" fill="#fff" fill-opacity=".1" rx="6"/><text x="389" y="19" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 Market Insights</text></g></g></svg>