<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
      
      @keyframes floatParticle {
        0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
        50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
        100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
      }
      
      @keyframes pulseGlow {
        0% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
        100% { opacity: 0.4; transform: scale(1); }
      }

      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -100; }
      }

      .particle-1 { animation: floatParticle 8s infinite ease-in-out; }
      .particle-2 { animation: floatParticle 12s infinite ease-in-out 2s; }
      .particle-3 { animation: floatParticle 10s infinite ease-in-out 4s; }
      .glowing-orb { animation: pulseGlow 6s infinite ease-in-out; transform-origin: center; }
      .animated-wave { stroke-dasharray: 10 15; animation: waveFlow 20s linear infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Dynamic Background Waves & Lights (Behind Foreground Text) -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" opacity="0.15" class="glowing-orb" filter="url(#glow)"/>
  <circle cx="1050" cy="280" r="200" fill="#ec4899" opacity="0.12" class="glowing-orb" filter="url(#glow)"/>

  <!-- Background Decorative Lines -->
  <path d="M-50 280 Q 300 120 600 250 T 1250 180" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" class="animated-wave"/>
  <path d="M-50 310 Q 350 150 650 280 T 1250 210" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.2" class="animated-wave"/>

  <!-- Dynamic Floating Geometry (Kept strictly to margins) -->
  <rect x="80" y="40" width="30" height="30" rx="6" fill="#818cf8" opacity="0.3" class="particle-1"/>
  <circle cx="1100" cy="90" r="16" fill="#f472b6" opacity="0.3" class="particle-2"/>
  <polygon points="1020,300 1040,330 1000,330" fill="#c084fc" opacity="0.3" class="particle-3"/>

  <!-- Decorative Glassmorphism Background Card (behind text) -->
  <rect x="60" y="50" width="1080" height="260" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Banner Content Layer (FOREGROUND) -->
  <g transform="translate(100, 100)">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="280" height="32" rx="16" fill="url(#accentGrad)"/>
      <text x="140" y="21" text-anchor="middle" class="badge-text">⚡ ENTERPRISE LEARNING &amp; LXP</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" class="title">Awesome Enterprise Learning Platform</text>
    
    <!-- Subtitle -->
    <text x="0" y="130" class="subtitle">Curated SaaS Products, Open-Source LMS, LXPs &amp; Compliance Platforms</text>
    
    <!-- Highlights Row -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#ffffff" fill-opacity="0.1"/>
      <text x="65" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">☁️ 10+ SaaS</text>
      
      <rect x="142" y="0" width="160" height="28" rx="6" fill="#ffffff" fill-opacity="0.1"/>
      <text x="222" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#4ade80">🔓 11+ Open-Source</text>

      <rect x="314" y="0" width="150" height="28" rx="6" fill="#ffffff" fill-opacity="0.1"/>
      <text x="389" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f472b6">📊 Market Insights</text>
    </g>
  </g>
</svg>
